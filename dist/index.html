<script>
(()=>{const strip=document.querySelector('.food-strip'),prev=document.querySelector('.gallery-prev'),next=document.querySelector('.gallery-next');if(!strip)return;const update=()=>{prev.disabled=strip.scrollLeft<2;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-2};prev.onclick=()=>strip.scrollBy({left:-strip.clientWidth*.75});next.onclick=()=>strip.scrollBy({left:strip.clientWidth*.75});strip.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);window.addEventListener('load',update);let start=0,scroll=0,drag=false;strip.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;drag=true;start=e.clientX;scroll=strip.scrollLeft;strip.setPointerCapture(e.pointerId);strip.style.scrollBehavior='auto';strip.style.cursor='grabbing'});strip.addEventListener('pointermove',e=>{if(drag)strip.scrollLeft=scroll+start-e.clientX});const stop=()=>{drag=false;strip.style.scrollBehavior='';strip.style.cursor=''};strip.addEventListener('pointerup',stop);strip.addEventListener('pointercancel',stop);update()})();
</script></body>
